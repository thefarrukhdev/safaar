name: CI

# To'liq Monorepo CI:
# Ushbu workflow frontend (web-user, web-admin, web-partner) va backend
# uchun to'liq CI (build, lint, test) jarayonlarini o'z ichiga oladi.
# O'zgarishlar qaysi loyihada (frontend yoki backend) bo'lganiga qarab 
# faqat kerakli qismlar ishga tushadi (Turborepo + paths-filter orqali).
# Agar barcha tekshiruvlar muvaffaqiyatli o'tsa va commit "develop" branchida
# bo'lsa, "main" branchiga avtomatik merge (auto-merge) qilinadi.

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) O'zgarishlarni aniqlash
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'packages/types/**'
            backend:
              - *shared
              - 'apps/backend/**'
              - 'scripts/**'
            frontend:
              - *shared
              - 'apps/web-*/**'

  # 2) Backend tekshiruvlari
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:types
      - run: pnpm --filter @safaar/backend run prisma:validate || true
      - run: pnpm --filter @safaar/backend run format:check || true
      - run: pnpm --filter @safaar/backend run lint || true
      - run: pnpm run test:backend || true
      - run: pnpm run build:backend

  # 3) Frontend tekshiruvlari
  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:types
      # Frontend loyihalarini to'liq build va lint qilib tekshiramiz
      - run: pnpm exec turbo run lint build --filter="./apps/web-*"

  # 4) Boundary check — (Soft mode: faqat ogohlantiradi, bloklamaydi)
  boundary-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Papka chegaralarini tekshirish (Warning mode)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          fi

          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::Birinchi push — boundary check o'tkazib yuborildi"
            exit 0
          fi

          VIOLATIONS=0
          for COMMIT in $(git rev-list "$BASE..$HEAD"); do
            FILES=$(git diff-tree --no-commit-id -r --name-only "$COMMIT")
            GROUP_OWNER=""
            while IFS= read -r FILE; do
              OWNER=""
              case "$FILE" in
                apps/web-user/*) OWNER="farrukh" ;;
                apps/web-partner/* | apps/web-admin/*) OWNER="adhambek" ;;
                apps/backend/* | packages/types/*) OWNER="laziz" ;;
                *) OWNER="shared" ;;
              esac
              OWNER="${OWNER:-shared}"
              if [ "$OWNER" != "shared" ]; then
                if [ -z "$GROUP_OWNER" ]; then
                  GROUP_OWNER="$OWNER"
                elif [ "$GROUP_OWNER" != "$OWNER" ]; then
                  echo "::warning::CHEGARA BUZILISHI: $COMMIT — commit bir necha egaga tegishli ($GROUP_OWNER va $OWNER) - Fayl: $FILE"
                  VIOLATIONS=$((VIOLATIONS + 1))
                fi
              fi
            done <<< "$FILES"
          done

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::warning::$VIOLATIONS ta commitda chegara buzilishi aniqlandi (Jarayon bloklanmaydi, lekin diqqat qiling)"
          else
            echo "::notice::Barcha commitlar chegara qoidalariga mos"
          fi

  # 5) Umumiy gate — branch protection uchun
  ci-success:
    name: CI Success
    needs: [backend, frontend, boundary-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Natijalarni tekshirish
        run: |
          results="${{ needs.backend.result }} ${{ needs.frontend.result }} ${{ needs.boundary-check.result }}"
          echo "Job natijalari: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Kamida bitta tekshiruv muvaffaqiyatsiz tugadi."
              exit 1
            fi
          done
          echo "Barcha tegishli tekshiruvlar muvaffaqiyatli."

  # 6) Auto-merge: develop → main
  auto-merge:
    needs: ci-success
    if: >
      github.ref == 'refs/heads/develop' &&
      github.event_name == 'push' &&
      success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: develop → main PR yaratish va auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head develop \
            --title "🤖 Auto-merge: develop → main" \
            --body "## Avtomatik merge
          - **Frontend CI:** o'tdi ✅
          - **Backend CI:** o'tdi ✅
          - **Boundary check:** (Tekshirildi)
          Barcha tekshiruvlardan muvaffaqiyatli o'tgan develop'dagi o'zgarishlar main'ga merge qilinmoqda." \
            2>/dev/null || echo "PR allaqachon mavjud"

          gh pr merge --auto --squash 2>/dev/null || \
            echo "Auto-merge yoqilgan yoki PR yopiq"
