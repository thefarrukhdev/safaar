global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'safaar-backend-prod'
    metrics_path: '/metrics'
    scheme: 'https'
    static_configs:
      - targets: ['api.safaar.uz']
        labels:
          environment: 'production'
          app: 'safaar-backend'

  - job_name: 'safaar-backend-local'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels:
          environment: 'local'
          app: 'safaar-backend'
