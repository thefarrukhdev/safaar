name: Frontend Deploy (Vercel)

# Safaar Monorepo — Frontend avtomatik deploy workflow
# Faqat `main` branchiga kod push qilinganda Vercel Production'ga deploy qilinadi:
# paths-filter orqali qaysi frontend ilova(lar) o'zgargani aniqlanadi:
#   - apps/web-admin/**   -> web-admin (staff.safaar.uz)
#   - apps/web-partner/** -> web-partner (partner.safaar.uz)
#   - apps/web-user/**    -> web-user (safaar.uz)
# Agar umumiy paketlar (package.json, pnpm-lock.yaml, packages/types/**) o'zgarsa,
# barcha 3 ta ilova ham Vercel Production muhitiga avtomatik deploy qilinadi.
# Deploy yakunlanganda Telegram bot orqali natija yuboriladi.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/web-admin/**"
      - "apps/web-partner/**"
      - "apps/web-user/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend-deploy.yml"

concurrency:
  group: vercel-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1) Qaysi ilovalar o'zgarganini tekshirish
  detect-changes:
    name: O'zgarishlarni aniqlash
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      partner: ${{ steps.filter.outputs.partner }}
      user: ${{ steps.filter.outputs.user }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'packages/**'
              - '.github/workflows/frontend-deploy.yml'
            admin:
              - *shared
              - 'apps/web-admin/**'
            partner:
              - *shared
              - 'apps/web-partner/**'
            user:
              - *shared
              - 'apps/web-user/**'

  # 2) web-admin (staff.safaar.uz)
  deploy-admin:
    name: Deploy web-admin (staff.safaar.uz)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.admin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vercel CLI o'rnatish
        run: npm install --global vercel@latest
      - name: Vercel loyihasini ulash va Production Deploy
        run: |
          echo "=== Vercel Auth Diagnosis ==="
          vercel whoami --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel teams ls --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel projects ls --token=${{ secrets.VERCEL_TOKEN }} || true
          echo "=== Linking Project ==="
          vercel link --yes --project=web-admin --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} || \
          vercel link --yes --project=web-admin --token=${{ secrets.VERCEL_TOKEN }}
          echo "=== Deploying Project ==="
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --yes || \
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
      - name: Xulosa
        run: |
          echo "### 🚀 web-admin (staff.safaar.uz) Vercel Production'ga muvaffaqiyatli deploy qilindi!" >> $GITHUB_STEP_SUMMARY
      - name: Telegram Bildirishnoma (Success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>🚀 Safaar Frontend Deploy</b>
            <b>Ilova:</b> web-admin (Super Admin)
            <b>Domen:</b> https://staff.safaar.uz
            <b>Branch:</b> <code>${{ github.ref_name }}</code>
            <b>Commit:</b> <code>${{ github.sha }}</code>
            <b>Muallif:</b> ${{ github.actor }}
            <b>Holat:</b> Muvaffaqiyatli yakunlandi ✅
      - name: Telegram Bildirishnoma (Failure)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>❌ Safaar Frontend Deploy Xatosi!</b>
            <b>Ilova:</b> web-admin (Super Admin)
            <b>Branch:</b> <code>${{ github.ref_name }}</code>
            <b>Muallif:</b> ${{ github.actor }}
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Loglarni ko'rish</a>

  # 3) web-partner (partner.safaar.uz)
  deploy-partner:
    name: Deploy web-partner (partner.safaar.uz)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.partner == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vercel CLI o'rnatish
        run: npm install --global vercel@latest
      - name: Vercel loyihasini ulash va Production Deploy
        run: |
          echo "=== Vercel Auth Diagnosis ==="
          vercel whoami --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel teams ls --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel projects ls --token=${{ secrets.VERCEL_TOKEN }} || true
          echo "=== Linking Project ==="
          vercel link --yes --project=web-partner --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} || \
          vercel link --yes --project=web-partner --token=${{ secrets.VERCEL_TOKEN }}
          echo "=== Deploying Project ==="
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --yes || \
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
      - name: Xulosa
        run: |
          echo "### 🚀 web-partner (partner.safaar.uz) Vercel Production'ga muvaffaqiyatli deploy qilindi!" >> $GITHUB_STEP_SUMMARY
      - name: Telegram Bildirishnoma (Success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>🚀 Safaar Frontend Deploy</b>
            <b>Ilova:</b> web-partner (Hamkor Kabineti)
            <b>Domen:</b> https://partner.safaar.uz
            <b>Branch:</b> <code>${{ github.ref_name }}</code>
            <b>Commit:</b> <code>${{ github.sha }}</code>
            <b>Muallif:</b> ${{ github.actor }}
            <b>Holat:</b> Muvaffaqiyatli yakunlandi ✅
      - name: Telegram Bildirishnoma (Failure)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>❌ Safaar Frontend Deploy Xatosi!</b>
            <b>Ilova:</b> web-partner (Hamkor Kabineti)
            <b>Branch:</b> <code>${{ github.ref_name }}</code>
            <b>Muallif:</b> ${{ github.actor }}
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Loglarni ko'rish</a>

  # 4) web-user (safaar.uz)
  deploy-user:
    name: Deploy web-user (safaar.uz)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.user == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vercel CLI o'rnatish
        run: npm install --global vercel@latest
      - name: Vercel loyihasini ulash va Production Deploy
        run: |
          echo "=== Vercel Auth Diagnosis ==="
          vercel whoami --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel teams ls --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel projects ls --token=${{ secrets.VERCEL_TOKEN }} || true
          echo "=== Linking Project ==="
          vercel link --yes --project=safaar-uz --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} || \
          vercel link --yes --project=safaar-uz --token=${{ secrets.VERCEL_TOKEN }}
          echo "=== Deploying Project ==="
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --yes || \
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
      - name: Xulosa
        run: |
          echo "### 🚀 web-user (safaar.uz) Vercel Production'ga muvaffaqiyatli deploy qilindi!" >> $GITHUB_STEP_SUMMARY
      - name: Telegram Bildirishnoma (Success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>🚀 Safaar Frontend Deploy</b>
            <b>Ilova:</b> web-user (Mijozlar Sayti)
            <b>Domen:</b> https://safaar.uz
            <b>Branch:</b> <code>${{ github.ref_name }}</code>
            <b>Commit:</b> <code>${{ github.sha }}</code>
            <b>Muallif:</b> ${{ github.actor }}
            <b>Holat:</b> Muvaffaqiyatli yakunlandi ✅
      - name: Telegram Bildirishnoma (Failure)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>❌ Safaar Frontend Deploy Xatosi!</b>
            <b>Ilova:</b> web-user (Mijozlar Sayti)
            <b>Branch:</b> <code>${{ github.ref_name }}</code>
            <b>Muallif:</b> ${{ github.actor }}
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Loglarni ko'rish</a>
